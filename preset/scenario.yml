# 空城计模式行为配置。
#
# 修改本文件后重跑 script/update-local.bat 同步、重启 dsh，
# 新开会话生效（已开的会话持有旧配置的 standing mount）。

# 思考轮数（最低 2；若小于「工具调用次数 + 1」会自动提升到该值，
# 以保证流程以思考轮结尾）
thinkingRounds: 11

# 工具调用次数（最低 1；从 fake-tools.json 中随机取工具调用，
# 工具数量不足时允许重复调用同一个工具）
toolCalls: 10

# 是否输出最终内容：
# true  = 按协议正常输出最终回复
# false = 不输出最终回复，回合以思考轮收尾后正常完结，
#         由系统强制写入一个换行作为最终输出
outputFinal: false
